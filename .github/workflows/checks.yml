name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 3 AM UTC to catch certificate rotations
    - cron: '0 3 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - uses: astral-sh/setup-uv@v4  # ruff comes ephemerally via uvx in the Makefile

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography

    - name: Lint check
      run: make lint-check

    - name: Run all tests
      run: make test
